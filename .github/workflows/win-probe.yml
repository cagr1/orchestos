name: win-probe (temporal WIN.6)
# Sonda temporal: hechos de Bun en Windows (.cmd y árbol de procesos). Se borra al cerrar WIN.6.
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - shell: bash
        run: |
          cat > probe.ts <<'EOF'
          import { spawn } from 'node:child_process'
          import { mkdtempSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { killTree, spawnTree } from './src/run/process-tree.ts'
          const dir = mkdtempSync(join(tmpdir(), 'probe-'))
          const log = (k: string, v: unknown) => console.log(`PROBE ${k}: ${JSON.stringify(v)}`)
          const alive = (pid: number) => { try { process.kill(pid, 0); return true } catch (e) { return (e as NodeJS.ErrnoException).code ?? String(e) } }
          const cmd = join(dir, 'fake.cmd')
          writeFileSync(cmd, '@echo off\r\necho hola %1\r\n')
          // node:child_process.spawn de un .cmd sin shell (codex-app-server, generic-cli)
          await new Promise<void>((done) => {
            try {
              const p = spawn(cmd, ['x'], { stdio: 'pipe', shell: false })
              let out = ''
              p.stdout.on('data', (c) => { out += c })
              p.on('error', (e) => { log('node spawn .cmd error', String(e)); done() })
              p.on('exit', (code) => { log('node spawn .cmd exit', { code, out: out.trim() }); done() })
            } catch (e) { log('node spawn .cmd threw', String(e)); done() }
          })
          // .cmd que lanza un nieto bun de larga vida; killTree debe matar los tres.
          const long = join(dir, 'long.cmd')
          writeFileSync(long, `@echo off\r\n"${process.execPath}" -e "console.log(process.pid);setTimeout(()=>{},60000)"\r\n`)
          const p = spawnTree([long], { stdout: 'pipe', stderr: 'ignore' })
          const grand = Number(new TextDecoder().decode((await p.stdout.getReader().read()).value).trim())
          log('cmd tree pids', { wrapper: p.pid, grand })
          killTree(p, 'SIGTERM')
          await Bun.sleep(500)
          log('after killTree', { wrapper: alive(p.pid), grand: alive(grand) })
          // Lo mismo con node:child_process (el camino de codex-app-server).
          const n = spawn(long, [], { stdio: 'pipe', shell: false, detached: true })
          n.on('error', (e) => log('node spawn long.cmd error', String(e)))
          const g2 = await new Promise<number>((r) => { n.stdout?.once('data', (c) => r(Number(String(c).trim()))); setTimeout(() => r(0), 5000) })
          log('node cmd tree pids', { wrapper: n.pid, grand: g2 })
          if (n.pid) { killTree(n, 'SIGTERM'); await Bun.sleep(500); log('node after killTree', { wrapper: alive(n.pid), grand: g2 ? alive(g2) : 'n/a' }) }
          process.exit(0)
          EOF
          bun install --frozen-lockfile >/dev/null
          bun run probe.ts

name: win-probe (temporal WIN.6)
# Sonda temporal: hechos de Bun en Windows (.cmd y árbol de procesos). Se borra al cerrar WIN.6.
on: workflow_dispatch
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - shell: bash
        run: |
          cat > probe.ts <<'EOF'
          import { mkdtempSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { killTree, spawnTree } from './src/run/process-tree.ts'
          const dir = mkdtempSync(join(tmpdir(), 'probe-'))
          const log = (k: string, v: unknown) => console.log(`PROBE ${k}: ${JSON.stringify(v)}`)
          const alive = (pid: number) => { try { process.kill(pid, 0); return true } catch (e) { return (e as NodeJS.ErrnoException).code ?? String(e) } }
          const cmd = join(dir, 'fake.cmd')
          writeFileSync(cmd, '@echo off\r\necho hola %1\r\n')
          // ¿Bun.spawn escapa bien argumentos hostiles hacia un .cmd? (BatBadBut)
          const echo = join(dir, 'args.cmd')
          writeFileSync(echo, `@echo off\r\n"${process.execPath}" -e "console.log(JSON.stringify(process.argv.slice(1)))" -- %*\r\n`)
          const marker = join(dir, 'PWNED')
          for (const arg of ['plain', 'a b', 'a" & echo x > "' + marker + '" & "', '%PATH%', 'x^y', 'a\\"b', 'línea\nnueva', '!x!']) {
            const r = Bun.spawnSync([echo, arg], { stderr: 'pipe' })
            log('arg ' + JSON.stringify(arg), { code: r.exitCode, out: r.stdout.toString().trim(), err: r.stderr.toString().trim().slice(0, 150) })
          }
          log('marker created', (await Bun.file(marker).exists()))
          // .cmd que lanza un nieto bun de larga vida; killTree debe matar los tres.
          const long = join(dir, 'long.cmd')
          writeFileSync(long, `@echo off\r\n"${process.execPath}" -e "console.log(process.pid);setTimeout(()=>{},60000)"\r\n`)
          const p = spawnTree([long], { stdout: 'pipe', stderr: 'pipe' })
          const reader = p.stdout.getReader()
          let text = ''
          for (let i = 0; i < 20 && !/\d/.test(text); i++) { const { value, done } = await reader.read(); if (done) break; text += new TextDecoder().decode(value) }
          const grand = Number(text.trim())
          log('cmd tree pids', { wrapper: p.pid, grand, text })
          killTree(p, 'SIGTERM')
          await Bun.sleep(800)
          log('after killTree', { wrapper: alive(p.pid), grand: grand ? alive(grand) : 'n/a' })
          process.exit(0)
          EOF
          bun install --frozen-lockfile >/dev/null
          bun run probe.ts

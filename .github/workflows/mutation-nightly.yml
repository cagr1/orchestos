name: Mutation Shards

on:
  # Nocturna en pausa durante la etapa 2 (CI.85, Carlos 2026-11-22). Reanudar: restaurar
  #   schedule:
  #     - cron: '0 3 * * *'
  # y poner `paused: false` en scripts/nightly-pause.json.
  workflow_dispatch:
    inputs:
      shard:
        description: 'Correr solo este shard (vacío = todos)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: executors-engines
            command: mutation:run:executors-engines
          - shard: executors-engines-b
            command: mutation:run:executors-engines-b
          - shard: executors-routing
            command: mutation:run:executors-routing
          - shard: executors-routing-b
            command: mutation:run:executors-routing-b
          - shard: executors-routing-c
            command: mutation:run:executors-routing-c
          - shard: executors-routing-d
            command: mutation:run:executors-routing-d
          - shard: executors-codex-server
            command: mutation:run:executors-codex-server
          - shard: executors-codex-server-b
            command: mutation:run:executors-codex-server-b
          - shard: executors-codex-server-c
            command: mutation:run:executors-codex-server-c
          - shard: executors-codex-server-d
            command: mutation:run:executors-codex-server-d
          - shard: executors-codex-server-e
            command: mutation:run:executors-codex-server-e
          - shard: executors-codex-engines
            command: mutation:run:executors-codex-engines
          - shard: executors-codex-engines-b
            command: mutation:run:executors-codex-engines-b
          - shard: runtime-boundaries-sandbox
            command: mutation:run:runtime-boundaries-sandbox
          - shard: runtime-boundaries-checks
            command: mutation:run:runtime-boundaries-checks
          - shard: context-routing
            command: mutation:run:context-routing
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.shard || inputs.shard == matrix.shard }}
      - uses: oven-sh/setup-bun@v2
        if: ${{ !inputs.shard || inputs.shard == matrix.shard }}
      - run: bun install --frozen-lockfile
        if: ${{ !inputs.shard || inputs.shard == matrix.shard }}
      - run: bun run typecheck
        if: ${{ !inputs.shard || inputs.shard == matrix.shard }}
      - name: Mutation run (with resource sampler)
        if: ${{ !inputs.shard || inputs.shard == matrix.shard }}
        shell: bash
        run: |
          (
            # GitHub runs bash with -e -o pipefail; SIGPIPE from `ps | head` must not end the sampler.
            set +e +o pipefail
            while true; do
              sleep 60
              mem=$(free -m | awk '/^Mem:/ {print $0}')
              memory_pressure=$(awk '/^some / {print $0}' /proc/pressure/memory)
              cpu_pressure=$(awk '/^some / {print $0}' /proc/pressure/cpu)
              process_count=$(ps -e --no-headers | wc -l)
              printf '[res] %s | %s | memory %s | cpu %s | processes %s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$mem" "$memory_pressure" "$cpu_pressure" "$process_count"
              ps -eo pid,ppid,pgid,etimes,rss,pcpu,args --sort=-rss | head -6 | \
                cut -c1-120 | sed 's/^/[res] /'
            done
          ) &
          sampler_pid=$!
          bun run ${{ matrix.command }} &
          command_pid=$!
          if wait "$command_pid"; then
            command_status=0
          else
            command_status=$?
          fi
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          exit "$command_status"
      - name: Upload mutation report
        if: ${{ always() && (!inputs.shard || inputs.shard == matrix.shard) }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          if-no-files-found: warn
          retention-days: 14

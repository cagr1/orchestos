name: README sync

on:
  schedule:
    - cron: '0 12 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run db:migrate
      - run: bun run test:coverage 2>&1 | tee /tmp/cov.log
      - run: bun run readme:sync -- --from-log /tmp/cov.log
      - name: Open pull request if README changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet README.md; then
            exit 0
          fi
          if [ "$(gh pr list --state open --search 'head:readme-sync' --json number --jq 'length')" != "0" ]; then
            echo "An open README sync pull request already exists."
            exit 0
          fi
          branch="readme-sync/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898309+github-actions[bot]@users.noreply.github.com" commit -am "docs: sync README test count and CLIs"
          git push origin "$branch"
          gh pr create --base master --head "$branch" --title "docs: sync README test count and CLIs" --body "Update README metadata from the scheduled coverage run."

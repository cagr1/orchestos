name: UI gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ui-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate
      - name: Run UI gates
        shell: bash
        run: |
          set +e
          bun run ui:gate smoke plan-doc project-delete 2>&1 | tee "$RUNNER_TEMP/ui-gate.log"
          gate_status=${PIPESTATUS[0]}
          evidence_path="$(sed -n 's/^EVIDENCE //p' "$RUNNER_TEMP/ui-gate.log" | tail -n 1)"
          if [[ -n "$evidence_path" && -f "$evidence_path" ]]; then
            cp "$evidence_path" "$RUNNER_TEMP/ui-gate-result.json"
          fi
          exit "$gate_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-gate-result
          path: ${{ runner.temp }}/ui-gate-result.json
          if-no-files-found: ignore

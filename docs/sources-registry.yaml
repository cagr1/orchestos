    last_synced_date: "2026-08-06"
    note: >
      En Q.1 (2026-08-06) el contenido SÍ se portó verbatim a una skill propia.
      qa-structured sigue siendo una prima independiente: evalúa criterios de
      aceptación, no es traducción de esta skill.

  - id: impeccable-checks
    repo: pbakaus/impeccable
    path: .claude/skills/impeccable/scripts/detector/rules/checks.mjs
    license: Apache-2.0
    local_artifact: skills/frontend-design.yaml
    last_synced_sha: 9a949fb543d44cfb406f61bcab99d95d7f12cf1d
    last_synced_date: "2026-08-02"
    note: >
      Detector mecánico real (5580 líneas) del que frontend-design.yaml
      destila reglas en prosa (contraste 4.5:1/3:1, gradient-text, eyebrow
      chip, round-dot radius). Verificado fiel en N.5.1 — un cambio acá
      puede traer un anti-patrón nuevo que vale la pena portar a los bans.

  - id: orca-agent-kind
    repo: stablyai/orca
    path: src/shared/agent-kind.ts
    license: MIT
    local_artifact: "IDEAS.md #39"
    last_synced_sha: 2d232171663a5a1fe24e2d2d7a95d7c6859155de
    last_synced_date: "2026-08-02"
    note: >
      Patrón de registro plano multi-CLI (34 agentes) que inspiró el
      registro de OrchestOS (cli-registry.ts) y el diseño propuesto para
      generalizar la invocación (promptInjectionMode-lite). Vigilar por
      nuevos agentes que Orca ya soporta y OrchestOS todavía no detecta.

  - id: orca-tui-agent-config
    repo: stablyai/orca
    path: src/shared/tui-agent-config.ts
    license: MIT
    local_artifact: "IDEAS.md #39"
    last_synced_sha: e58c051d16c179106ccbb8737fc55ccd85a0afc7
    last_synced_date: "2026-08-02"
    note: >
      Fuente del enum promptInjectionMode (6 estrategias de invocación) que
      IDEAS #39 propone adaptar como promptInjectionMode-lite. Vigilar por
      estrategias nuevas o cambios en las 6 existentes.

  - id: mattpocock-code-review-smells
    repo: mattpocock/skills
    path: skills/engineering/code-review/SKILL.md
    license: MIT
    local_artifact: skills/pro/code-review.yaml
    last_synced_sha: c0d69015e0cc8b66715beb3f93f9e53256e20f30
    last_synced_date: "2026-08-06"
    note: >
      Confirmado en N.7c. El catálogo de 12 code smells de Fowler
      (Mysterious Name, Duplicated Code, Feature Envy, Data Clumps, Primitive
      Obsession, Repeated Switches, Shotgun Surgery, Divergent Change,
      Speculative Generality, Message Chains, Middle Man, Refused Bequest) se
      portó a la Pass 2 (Design) de code-review.yaml. El resto del upstream
      (subagentes paralelos Standards+Spec, plantilla de issue tracker) no es
      portable — depende de primitivas que OrchestOS no tiene igual. Vigilar
      si la fuente agrega o cambia smells del baseline.
      PRIMERA DERIVA REAL DEL BLOQUE P (2026-08-06, detectada 1 día después de
      N.7c): upstream pasó a c0d6901. Diff real inspeccionado — quita 2 líneas
      sobre cómo invocar dos sub-agentes en paralelo ("Send a single message
      with two Agent tool calls"). NO toca el catálogo de smells, que es lo
      único que portamos. Nada que portar; `last_synced_sha` avanzado porque
      la fidelidad SÍ se re-verificó contra ese commit (dejarlo viejo
      reportaría deriva para siempre y mataría la señal).

  - id: superpowers-systematic-debugging

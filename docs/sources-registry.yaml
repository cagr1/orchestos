# Registro de fuentes externas de las que OrchestOS robó contenido/diseño.
# Bloque P (PLAN.md), 2026-08-02 — pregunta de Carlos: "todas las repos se
# actualizan, ¿cómo sabemos si mejoraron justo la pieza que ocupamos?"
#
# Vigilamos PATHS exactos, no repos completos — un repo cambia por cosas que
# no importan; solo el archivo/carpeta de donde copiamos algo es relevante.
#
# `last_synced_sha` es el commit contra el que se verificó fidelidad la
# última vez (no el commit original en que se copió, que en varios casos se
# perdió — los 4 primeros se fijaron en la auditoría de N.5.1, 2026-08-02).
# `scripts/check-sources-drift.ts` compara este campo contra el HEAD actual
# del path y reporta en SOURCES_DRIFT.md — nunca actualiza este archivo solo.
#
# Al aplicar una mejora real desde una fuente, actualizar `last_synced_sha`
# a mano en el mismo commit que aplica el cambio.

sources:
  - id: superpowers-tdd
    repo: obra/superpowers
    path: skills/test-driven-development/SKILL.md
    license: MIT
    local_artifact: skills/tdd-enforcer.yaml
    last_synced_sha: b9e75dddec7a384f42ce08532ec17bb1ef5d9459
    last_synced_date: "2026-08-02"
    note: >
      Fuente literal del patrón Iron Law/Common Rationalizations/Red Flags.
      tdd-enforcer.yaml copia las 10 rationalizations y 13 red_flags casi
      verbatim (N.5.1) — cualquier cambio en esta tabla en la fuente es
      candidato directo a portar.

  - id: superpowers-verification
    repo: obra/superpowers
    path: skills/verification-before-completion/SKILL.md
    license: MIT

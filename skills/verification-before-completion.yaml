id: verification-before-completion
version: 1.0.0
name: Verification Before Completion
description: Use when about to claim work is complete, fixed, or passing - requires running verification commands and confirming output before making success claims
targets:
  - claude
  - cursor
  - openai
allowed_tools:
  - read
  - bash
iron_law: NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE
when_to_use:
  - Before any variation of a success or completion claim
  - Before any expression of satisfaction
  - Before any positive statement about work state
  - Before committing, creating a PR, completing a task, moving to the next task, or delegating to agents
inputs_required:
  - The claim or status to be verified
  - The full verification command that proves the claim
  - The command output and exit code
instructions: |
  ## The Gate Function

  ```
  BEFORE claiming any status or expressing satisfaction:

  1. IDENTIFY: What command proves this claim?
  2. RUN: Execute the FULL command (fresh, complete)
  3. READ: Full output, check exit code, count failures
  4. VERIFY: Does output confirm the claim?
     - If NO: State actual status with evidence
     - If YES: State claim WITH evidence
  5. ONLY THEN: Make the claim

  Skip any step = lying, not verifying
  ```

  ## Common Failures

  | Claim | Requires | Not Sufficient |
  |-------|----------|----------------|
  | Tests pass | Test command output: 0 failures | Previous run, "should pass" |
  | Linter clean | Linter output: 0 errors | Partial check, extrapolation |
  | Build succeeds | Build command: exit 0 | Linter passing, logs look good |
  | Bug fixed | Test original symptom: passes | Code changed, assumed fixed |
  | Regression test works | Red-green cycle verified | Test passes once |
  | Agent completed | VCS diff shows changes | Agent reports "success" |
  | Requirements met | Line-by-line checklist | Tests passing |

  ## Key Patterns

  **Tests:**
  ```
  ✅ [Run test command] [See: 34/34 pass] "All tests pass"
  ❌ "Should pass now" / "Looks correct"
  ```

  **Regression tests (TDD Red-Green):**
  ```
  ✅ Write → Run (pass) → Revert fix → Run (MUST FAIL) → Restore → Run (pass)
  ❌ "I've written a regression test" (without red-green verification)
  ```

  **Build:**
  ```
  ✅ [Run build] [See: exit 0] "Build passes"
  ❌ "Linter passed" (linter doesn't check compilation)
  ```

  **Requirements:**
  ```
  ✅ Re-read plan → Create checklist → Verify each → Report gaps or completion
  ❌ "Tests pass, phase complete"
  ```

  **Agent delegation:**
  ```
  ✅ Agent reports success → Check VCS diff → Verify changes → Report actual state
  ❌ Trust agent report
  ```
common_rationalizations:
  - excuse: Should work now
    refutation: RUN the verification
  - excuse: I'm confident
    refutation: Confidence ≠ evidence
  - excuse: Just this once
    refutation: No exceptions
  - excuse: Linter passed
    refutation: Linter ≠ compiler
  - excuse: Agent said success
    refutation: Verify independently
  - excuse: I'm tired
    refutation: Exhaustion ≠ excuse
  - excuse: Partial check is enough
    refutation: Partial proves nothing
  - excuse: Different words so rule doesn't apply
    refutation: Spirit over letter
red_flags:
  - Using "should", "probably", "seems to"
  - Expressing satisfaction before verification ("Great!", "Perfect!", "Done!", etc.)
  - About to commit/push/PR without verification
  - Trusting agent success reports
  - Relying on partial verification
  - Thinking "just this once"
  - Tired and wanting work over
  - ANY wording implying success without having run verification
verifiers:
  - The full verification command was run fresh and its complete output was read
  - The exit code and failure count were checked against the claim
  - Any success claim is accompanied by the confirming verification evidence, or the actual failing status is reported
examples:
  - title: Verifying a test claim
    input: "The tests should pass now."
    output: "IDENTIFY the test command → RUN the full command → READ the complete output and exit code → VERIFY 34/34 pass → State: All tests pass, with evidence."
  - title: Verifying delegated completion
    input: "An agent reports that the implementation is complete."
    output: "Check the VCS diff → Run the required verification commands → Read the output → Report the actual verified state, not the agent's success report."

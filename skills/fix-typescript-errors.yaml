id: fix-typescript-errors
version: 1.0.0
name: Fix TypeScript Errors
description: Use when `tsc` fails, the build breaks on type errors, or an editor shows red squiggles across TypeScript files.
when_to_use:
  - When `tsc --noEmit` or the build reports TypeScript compilation errors
  - When a dependency upgrade broke types across the codebase
  - When migrating a JavaScript file to TypeScript leaves type errors behind
  - When strict mode was enabled and the codebase now fails to compile
targets:
  - claude
  - cursor
  - openai
allowed_tools:
  - read
  - write
  - edit
instructions: |
  1. Run `tsc --noEmit` and capture the full error output.
  2. For each error, locate the exact file and line number.
  3. Apply the minimum change that fixes the error — do not refactor unrelated code.
  4. Prefer type assertions or explicit annotations over structural changes.
  5. Run `tsc --noEmit` again to confirm zero errors before finishing.
  6. If an error requires a dependency change, ask before installing anything.

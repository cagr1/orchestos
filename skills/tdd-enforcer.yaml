id: tdd-enforcer
version: 1.0.0
name: TDD Enforcer
description: Use when adding new functionality, fixing a bug, or touching code with zero tests — the test must fail before the implementation exists.
targets:
  - claude
  - cursor
  - openai
allowed_tools:
  - read
  - write
  - edit
activation:
  mode: suggest
  phases:
    - implement
    - fix
iron_law: Never write implementation code before a failing test exists for it.
when_to_use:
  - When adding a new function, class, or module
  - When fixing a bug — write a test that reproduces the bug first
  - When a feature has no tests and you are about to modify it
inputs_required:
  - Task description or feature specification
  - Existing test file location (or where to create one)
  - Test runner command for this project
instructions: |
  Follow red-green-refactor. The order is not optional.

  **RED — Write a failing test first**
  Write the test before any implementation exists.
  The test must:
  - Call the function/class/endpoint as the final consumer would
  - Assert the expected behavior, not the implementation details
  - Fail when you run the test suite right now

  Run the test suite. Confirm it fails. If it passes, the test is wrong — fix it.

  **GREEN — Write the minimum implementation to pass**
  Write only what is needed to make the test pass.
  No extra features. No "while I'm here" improvements.
  Run the test suite. Confirm it passes.

  **REFACTOR — Clean without breaking**
  Now improve the implementation: extract duplication, rename for clarity, simplify logic.
  Run the test suite after each change. It must stay green the entire time.
  If it goes red, undo the last change before continuing.

  Done when: tests green, code clean, no TODOs left.
anti_patterns:
  - Write the implementation first, then write tests to match it
  - Write tests after the fact to hit a coverage number
  - Test implementation details (internal function names, private state) instead of behavior
  - Skip the refactor phase — green + messy is not done
  - Delete or comment out a test to make the suite pass
  - Write multiple features in one red-green-refactor cycle
# common_rationalizations y red_flags copiados casi verbatim de la fuente real
# (obra/superpowers, skills/test-driven-development/SKILL.md, MIT, verificado
# 2026-08-02) — el bloque N.5 original los escribió genéricos y perdió el
# detalle real de la tabla; corregido tras auditoría de fidelidad de Carlos.
common_rationalizations:
  - excuse: Too simple to test.
    refutation: Simple code breaks. Test takes 30 seconds.
  - excuse: I'll test after.
    refutation: Tests written after pass immediately — which proves nothing. They may test the wrong thing, test the implementation instead of the behavior, or miss the edge case you forgot. You never watched it fail, so you never proved it can catch the bug. Test-first forces that failure.
  - excuse: Tests after achieve the same goals — it's about spirit, not ritual.
    refutation: Tests-after answer "what does this do?"; tests-first answer "what should this do?" Tests written after are biased by the code you already wrote — you verify the cases you remembered, not the ones you'd have discovered. Coverage without proof the tests work.
  - excuse: Already manually tested it.
    refutation: Manual testing is ad-hoc — no record of what you covered, no way to re-run it when the code changes, easy to forget cases under pressure. "Worked when I tried it" is not the same as comprehensive. Automated tests run the same way every time.
  - excuse: I already spent hours on this, deleting it is wasteful.
    refutation: Sunk cost fallacy — that time is already spent either way. The real choice is rewrite with TDD (high confidence) vs. keep it and bolt tests on after (low confidence, likely bugs). Keeping code you can't trust is the waste.
  - excuse: I'll keep the existing code as reference and write the tests first.
    refutation: You'll adapt it. That's testing after. Delete means delete.
  - excuse: I need to explore the problem first before writing a test.
    refutation: Fine — throw away the exploration code, then start fresh with TDD.
  - excuse: This code is hard to write a test for, so the test approach doesn't fit here.
    refutation: Listen to the test. Hard to test means hard to use — that's a design signal, not a reason to skip TDD.
  - excuse: TDD will slow me down on this task.
    refutation: TDD is the pragmatic path — it catches bugs before commit, prevents regressions, and lets you refactor without fear. "Pragmatic" shortcuts mean debugging in production, which is slower, not faster.
  - excuse: A manual test is faster than writing an automated one.
    refutation: Manual testing doesn't prove edge cases, and you'll have to re-run it by hand on every future change.
red_flags:
  - Code was written before the test
  - The test was written after the implementation
  - The test passed immediately on the first run
  - Cannot explain why the test failed before the fix
  - Tests were added "later" instead of first
  - Rationalizing "just this once"
  - "I already manually tested it"
  - "Tests after achieve the same purpose"
  - "It's about spirit, not ritual"
  - 'Keep as reference, or "adapt" existing code instead of deleting it'
  - "Already spent hours on this, deleting it is wasteful"
  - "TDD is dogmatic, I'm being pragmatic"
  - "This case is different because..."
verifiers:
  - Test suite fails before implementation is written (red confirmed)
  - Test suite passes after implementation (green confirmed)
  - Test suite stays green through all refactor changes
  - No test was deleted or skipped to achieve green
examples:
  - title: New utility function
    input: "Add a formatCurrency(amount, currency) function that formats 1234.5 as '$1,234.50'"
    output: "1. Write test: expect(formatCurrency(1234.5, 'USD')).toBe('$1,234.50') — run: FAIL (function doesn't exist). 2. Implement formatCurrency. Run: PASS. 3. Refactor: extract locale map. Run: PASS."
  - title: Bug fix with TDD
    input: "Bug: formatCurrency(-50, 'USD') returns '$-50.00' instead of '-$50.00'"
    output: "1. Write test: expect(formatCurrency(-50, 'USD')).toBe('-$50.00') — run: FAIL (reproduces bug). 2. Fix sign handling. Run: PASS. 3. No refactor needed."
language_targets:
  typescript:
    verifiers:
      - bun test
      - npx tsc --noEmit
    anti_patterns:
      - skip describe blocks
      - use any to bypass type checking in tests
  javascript:
    verifiers:
      - npm test
    anti_patterns:
      - skip describe blocks
      - console.log instead of assertions
  csharp:
    verifiers:
      - dotnet test
    anti_patterns:
      - '[Ignore] without a documented reason'
      - Assert.IsTrue(x == y) instead of Assert.AreEqual
  visualbasic:
    verifiers:
      - dotnet test
    anti_patterns:
      - magic numbers without named constants
  fsharp:
    verifiers:
      - dotnet test
    anti_patterns:
      - mutable test state
  python:
    verifiers:
      - python -m pytest
    anti_patterns:
      - skip unittest.TestCase in favor of pytest
      - bare assert without message
  rust:
    verifiers:
      - cargo test
    anti_patterns:
      - unwrap() in test assertions
      - test only the happy path
  go:
    verifiers:
      - go test ./...
    anti_patterns:
      - ignore error returns in tests
      - non-isolated table-driven subtests
  java:
    verifiers:
      - mvn test
    anti_patterns:
      - '@Ignore without reason'
      - assertEquals(expected, actual) order reversed
  kotlin:
    verifiers:
      - gradle test
    anti_patterns:
      - runBlocking without timeout in coroutine tests
  ruby:
    verifiers:
      - bundle exec rspec
    anti_patterns:
      - before(:all) with shared state
  r:
    verifiers:
      - Rscript -e "testthat::test_dir('tests')"
    anti_patterns:
      - test without expect_* functions
  default:
    verifiers:
      - run your test suite

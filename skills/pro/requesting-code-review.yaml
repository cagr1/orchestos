id: requesting-code-review
version: 1.0.0
name: Requesting Code Review
description: Use when completing tasks, implementing major features, or before merging to verify work meets requirements
targets:
  - claude
  - cursor
  - openai
allowed_tools:
  - read
when_to_use:
  - After each task in subagent-driven development
  - After completing a major feature
  - Before merging to main
  - When stuck, for a fresh perspective
  - Before refactoring, as a baseline check
  - After fixing a complex bug
inputs_required:
  - The base SHA and head SHA
  - A brief description of the change
  - The plan or requirements the change must satisfy
instructions: |
  Dispatch a code reviewer subagent to catch issues before they cascade. The reviewer gets precisely crafted context for evaluation — never your session's history.

  **Core principle:** Review early, review often.

  **How to Request**

  **1. Get git SHAs:**
  ```bash
  BASE_SHA=$(git rev-parse HEAD~1)  # or origin/main
  HEAD_SHA=$(git rev-parse HEAD)
  ```

  **2. Dispatch code reviewer subagent:**

  Dispatch a `general-purpose` subagent, filling the template at [code-reviewer.md](code-reviewer.md)

  **Placeholders:**
  - `{DESCRIPTION}` - Brief summary of what you built
  - `{PLAN_OR_REQUIREMENTS}` - What it should do
  - `{BASE_SHA}` - Starting commit
  - `{HEAD_SHA}` - Ending commit

  **3. Act on feedback:**
  - Fix Critical issues immediately
  - Fix Important issues before proceeding
  - Note Minor issues for later
  - Push back if reviewer is wrong (with reasoning)

  **Example**

  ```
  [Just completed Task 2: Add verification function]

  You: Let me request code review before proceeding.

  BASE_SHA=$(git log --oneline | grep "Task 1" | head -1 | awk '{print $1}')
  HEAD_SHA=$(git rev-parse HEAD)

  [Dispatch code reviewer subagent]
    DESCRIPTION: Added verifyIndex() and repairIndex() with 4 issue types
    PLAN_OR_REQUIREMENTS: Task 2 from docs/superpowers/plans/deployment-plan.md
    BASE_SHA: a7981ec
    HEAD_SHA: 3df7661

  [Subagent returns]:
    Strengths: Clean architecture, real tests
    Issues:
      Important: Missing progress indicators
      Minor: Magic number (100) for reporting interval
    Assessment: Ready to proceed

  You: [Fix progress indicators]
  [Continue to Task 3]
  ```
common_rationalizations:
  - excuse: "I'll just review the diff myself instead of dispatching a reviewer"
    refutation: "You're the coordinator — reviewing the diff inline burns the context window you need to keep driving the work. Dispatch a reviewer subagent: the diff and the evaluation live in its context, and only the findings come back to you."
  - excuse: "The reviewer needs my whole session history to understand the change"
    refutation: "Hand it precisely crafted context, never your session's history. That keeps the reviewer on the work product, not your thought process."
red_flags:
  - Skip review because "it's simple"
  - Ignore Critical issues
  - Proceed with unfixed Important issues
  - Argue with valid technical feedback
anti_patterns:
  - Argue with a reviewer who is wrong instead of pushing back with technical reasoning
  - Push back without showing code or tests that prove the work
  - Request clarification without first making the technical issue specific
verifiers:
  - A reviewer subagent was dispatched with DESCRIPTION, PLAN_OR_REQUIREMENTS, BASE_SHA, and HEAD_SHA
  - Critical and Important findings were fixed or explicitly documented before proceeding
examples:
  - title: Request review after Task 2
    input: "Added verifyIndex() and repairIndex() with 4 issue types; BASE_SHA: a7981ec; HEAD_SHA: 3df7661"
    output: "Dispatch code reviewer subagent with the task description and requirements. Fix the Important missing progress indicators before continuing to Task 3; note the Minor magic-number issue for later."

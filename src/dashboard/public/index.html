<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrchestOS — Dashboard</title>
  <script src="theme.js"></script>
  <link rel="icon" href="assets/logo_white.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/logo_black.png" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="screens.css">
  <!-- Capa Tailwind/shadcn de las islas React (Mes 30). Se genera con `bun run build:ui`
       y NO se versiona: install.sh/ps1/bat la reconstruyen. Va DESPUES del CSS vanilla
       para que las utilidades ganen por orden, no por !important. -->
  <link rel="stylesheet" href="dist/ui.css">
</head>
<body data-cards="flat">
  <div class="app">

    <!-- SIDEBAR — brand (solo texto, sin logo) + panel-left + search viven acá
         (2026-07-13, corrección de Carlos): buildNav() los inyecta como una fila al
         tope del riel de íconos. Colapsado, solo queda el ícono panel-left. -->
    <nav class="sidebar" id="sidebar" data-island="shell-sidebar"></nav>
    <div class="resize-handle resize-handle-sidebar" id="sidebarResizeHandle"></div>

    <!-- HEADER — sin borde inferior, sin contador "N active", SIN íconos
         (2026-07-13, corrección de Carlos ronda 4): el toggle del panel
         derecho vive únicamente DENTRO del aside (#rpToprow) — nunca acá,
         nunca se duplica. El header solo lleva el pill de estado. -->
    <header class="header" data-island="shell-header"></header>

    <!-- MAIN -->
    <main class="main" id="main"></main>

    <!-- RIGHT PANEL — SIEMPRE presente (igual que el sidebar izquierdo, ronda 4):
         riel angosto con el ícono de toggle fijo cuando está cerrado, se
         ensancha a --rightpanel-w mostrando explorer/terminal/diff al abrir.
         El toggle nunca cambia de posición ni de contenedor. -->
    <aside class="rightpanel" id="rightpanel">
      <div class="rp-toprow" id="rpToprow" data-island="shell-rp-toprow"></div>
      <div class="rp-body" id="rightpanelBody"></div>
    </aside>
    <div class="resize-handle resize-handle-rightpanel" id="rightpanelResizeHandle"></div>

  </div>

  <script src="marked.umd.js"></script>
  <script src="i18n.js"></script>
  <script src="data.js"></script>
  <script src="screens-core.js"></script>
  <script src="screens-ops.js"></script>
  <script src="app.js"></script>
  <!-- Bundle de islas React. Va ULTIMO y a proposito: necesita que `window.App` ya
       exista para envolver App.rerender() (ver public-src/lib/islands.ts). Es un modulo
       ESM, asi que corre diferido despues de todos los scripts clasicos de arriba. -->
  <script type="module" src="dist/ui.js"></script>
</body>
</html>
